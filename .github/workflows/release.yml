# Cut an AppImage on every version tag (vX.Y.Z) and publish it as a GitHub
# Release. Built with SDRplay support so the panadapter works, but the
# proprietary libsdrplay_api is EXCLUDED from the bundle (never redistribute
# it) — the user's own SDRplay API install provides it at runtime, which
# install.sh sets up. The VOACAP engine (voacapl) IS bundled: its core is
# US-government public-domain code and the port is open source, so the
# propagation overlay works out of the box. Built on ubuntu-24.04 — so the
# AppImage needs glibc >= 2.39 (Ubuntu 24.04+, Fedora 40+, current Arch).
# Qt comes from the official installer (aqt, 6.8), NOT Ubuntu's 6.4: the GPU
# panadapter and the AetherSDR panes need Qt >= 6.7 + ShaderTools, and the
# operator wants the published build to be the same console as the one on
# his desk (2026-11-03). CI still compiles against Ubuntu's 6.4 so the CPU
# paint path stays honest.
name: Release
on:
  push:
    tags: ['v*']
  # Run by hand (Actions → Release → Run workflow): the WINDOWS job alone,
  # its zip kept as a run artifact instead of a release — the way to shake
  # the Windows build out without cutting a tag (2026-11-08).
  workflow_dispatch:
permissions:
  contents: write

jobs:
  appimage:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ make gfortran \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libegl1 libfontconfig1 libglib2.0-0 libvulkan-dev \
            autoconf automake libtool curl file \
            fuse libfuse2 desktop-file-utils libfftw3-dev patch

      # Qt 6.8 from the official installer: base + SerialPort + WebSockets
      # + ShaderTools (qsb compiles the GPU pan's shaders at build time).
      # GuiPrivate headers ship with the base package. The sqlite driver
      # plugin is in base too.
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtserialport qtwebsockets qtshadertools'
          cache: true

      - name: Build rnnoise from source
        run: |
          git clone --depth 1 https://gitlab.xiph.org/xiph/rnnoise.git /tmp/rnnoise || git clone --depth 1 https://github.com/xiph/rnnoise.git /tmp/rnnoise
          cd /tmp/rnnoise && ./autogen.sh && ./configure --prefix=/usr/local
          make -j"$(nproc)" && sudo make install && sudo ldconfig

      # whisper.cpp for Copy Assist — the desk build has Arch's whisper-cpp
      # 1.9.5, so the release gets the same version, built the way Arch
      # builds it: shared libs, NOT tuned to the runner's CPU, with the
      # ggml CPU backends as loadable variants picked at run time
      # (ggml_backend_load_all). Those backend .so files are dlopen'd, so
      # the AppImage step copies them in by hand (linuxdeploy can't see
      # them). The operator's rule (2026-11-03): the release matches the
      # desk build in everything.
      - name: Build whisper.cpp (Copy Assist)
        run: |
          git clone --depth 1 -b v1.9.5 https://github.com/ggml-org/whisper.cpp /tmp/whisper
          cmake -S /tmp/whisper -B /tmp/whisper/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF \
            -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/whisper/build -j"$(nproc)"
          sudo cmake --install /tmp/whisper/build
          sudo ldconfig
          # ggml installs the dlopen-only CPU variants into the BIN dir, not lib
          # (that is upstream's install rule for GGML_BACKEND_DL; live-found 2026-11-03).
          ls /usr/local/bin/libggml-cpu-*.so
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion whisper

      # voacapl: the real VOACAP engine for the propagation overlay.
      # Public-domain core (NTIA/ITS) — bundling is legal and deliberate.
      - name: Build voacapl (bundled propagation engine)
        run: |
          git clone --depth 1 https://github.com/jawatson/voacapl /tmp/voacapl
          cd /tmp/voacapl
          automake --add-missing || true
          autoreconf || true
          ./configure --prefix=/tmp/voa
          make -j"$(nproc)"
          make install
          HOME=/tmp/voahome /tmp/voa/bin/makeitshfbc
          test -d /tmp/voahome/itshfbc/run

      # SDRplay API: extract the makeself installer without running it, then
      # place headers + the .so so cmake can link against it. The .so itself
      # is excluded from the AppImage below.
      - name: Install SDRplay API (build-time only)
        run: |
          VER=3.15.2
          # SDRplay withdrew every standalone API .run from /software/ in the
          # SDRconnect era (live-found 2026-09-03: all versions 404, and their
          # new install.sh ships no API at all). Vendor URL first in case it
          # returns, else the Internet Archive's snapshot of the exact bytes
          # this job used while the URL lived (id_ = original payload).
          curl -fSL "https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-${VER}.run" -o sdr.run \
            || curl -fSL "https://web.archive.org/web/20260805142854id_/https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-${VER}.run" -o sdr.run
          sh sdr.run --noexec --target sdr_api || sh sdr.run --tar xf || true
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo cp $(find sdr_api -name '*.h') /usr/local/include/ 2>/dev/null || true
          echo "--- all libsdrplay_api.so* in the archive ---"
          find sdr_api -name 'libsdrplay_api.so*'
          echo "----------------------------------------------"
          # Pick the 64-bit Intel build: whatever is NOT an ARM variant.
          SO=$(find sdr_api -name 'libsdrplay_api.so*' | grep -viE 'arm|aarch' | head -1)
          echo "selected SDRplay lib: $SO"
          test -n "$SO" || { echo "no non-ARM SDRplay lib found"; exit 1; }
          sudo cp "$SO" /usr/local/lib/
          B=$(basename "$SO")
          sudo ln -sf "/usr/local/lib/$B" /usr/local/lib/libsdrplay_api.so.3
          sudo ln -sf /usr/local/lib/libsdrplay_api.so.3 /usr/local/lib/libsdrplay_api.so
          sudo ldconfig

      - name: Configure + build (with SDRplay)
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SDRPLAY=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;/usr/local" \
            -DCMAKE_CXX_FLAGS=-I/usr/local/include \
            -DCMAKE_EXE_LINKER_FLAGS=-L/usr/local/lib | tee configure.log
          # The published build must be the operator's build: a release
          # that silently fell back to the CPU-only panadapter is a bug.
          grep -q "GPU panadapter: on" configure.log
          grep -q "Copy Assist: whisper" configure.log
          grep -q "WDSP: SDR receive audio enabled" configure.log
          grep -q "SDRplay RSP source: ENABLED" configure.log
          cmake --build build -j"$(nproc)"

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps \
                   AppDir/usr/share/tentec-console
          cp build/tentec-console AppDir/usr/bin/
          cp /tmp/voa/bin/voacapl AppDir/usr/bin/
          # -L matters: makeitshfbc SYMLINKS the ionosphere coefficient
          # files back to the install prefix; carried as links they die
          # with the build machine (live-found: the bundled tree had 1 of
          # 45 coeffs files and the engine crashed). Dereference so the
          # bundle is self-contained.
          cp -rL /tmp/voahome/itshfbc AppDir/usr/share/tentec-console/itshfbc
          cp packaging/tentec-console.desktop AppDir/usr/share/applications/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/tentec-console.png

      - name: Build AppImage (exclude proprietary SDRplay lib)
        run: |
          curl -fSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Qt's TLS backend plugin is NOT deployed by default — without it
          # every https fetch dies (NOAA solar data, the POTA feed, and the
          # VOACAP trigger that waits on a sunspot number). Live-found by
          # stranger-testing the published image with a fresh HOME. OpenSSL
          # itself must NOT be half-bundled: a stray bundled libcrypto 3.0
          # paired with the host's newer libssl fails symbol versioning
          # (also live-found), so both openssl libs are excluded below and
          # every host supplies its own matched pair.
          export EXTRA_QT_PLUGINS="tls"
          # The official Qt ships SQL drivers for Mimer/MySQL/Postgres/ODBC
          # whose client libraries aren't here, and the qt plugin deploys
          # every driver it finds and dies on the first missing dependency
          # (libmimerapi.so, live-found 2026-11-03). The log is SQLite only.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name 'libqsql*.so' \
            ! -name 'libqsqlite.so' -print -delete
          export OUTPUT="tentec-console-${GITHUB_REF_NAME}-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt \
            --executable AppDir/usr/bin/voacapl \
            --desktop-file AppDir/usr/share/applications/tentec-console.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/tentec-console.png \
            --exclude-library 'libsdrplay_api*' \
            --exclude-library 'libssl*' \
            --exclude-library 'libcrypto*' \
            --output appimage
          # --exclude-library does not reach libraries the qt plugin deploys
          # on its own (libcrypto rode in with the tls plugin's deps and the
          # published image still failed — live-found). Strip the OpenSSL
          # pair from the AppDir and repack: hosts load their own matched
          # pair, and 3.x hosts satisfy any bundled lib's 3.0 symbols.
          rm -f AppDir/usr/lib/libssl.so* AppDir/usr/lib/libcrypto.so*
          # ggml's CPU backend variants are dlopen'd from the directory of
          # libggml-base (and the executable's); they never appear as ELF
          # dependencies and ggml installs them under bin/, not lib/,
          # so copy them in beside both.
          cp /usr/local/bin/libggml-cpu-*.so AppDir/usr/lib/
          cp /usr/local/bin/libggml-cpu-*.so AppDir/usr/bin/
          ls AppDir/usr/lib/libggml-cpu-*.so | wc -l
          curl -fSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          rm -f "$OUTPUT"
          ARCH=x86_64 ./appimagetool AppDir "$OUTPUT"
          ls -lh *.AppImage

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Alpha, but NOT a GitHub "pre-release": pre-releases are invisible
          # to /releases/latest and `gh release download`, which is what
          # every newcomer (and their AI helper) reaches for first.
          prerelease: false
          make_latest: true
          files: tentec-console-*-x86_64.AppImage
          body: |
            Alpha AppImage of Orion Control (Ten-Tec Orion / Omni VII console).

            **Install (easiest):** run the one-liner from the README, or:
            `bash <(curl -fsSL https://raw.githubusercontent.com/n8mus/Orion-Control/master/install.sh)`

            The SDRplay API (proprietary, required for the panadapter) is NOT
            bundled — install.sh sets it up, or get it from sdrplay.com/api.
            The VOACAP propagation engine IS bundled (public-domain core):
            the map-backdrop propagation overlay works out of the box.
            Radio control needs your user in the dialout/uucp group (install.sh
            does this). First launch opens the Setup screen.

  # ---- Windows x64 zip --------------------------------------------------
  # The same console for Windows, built on GitHub instead of the station's
  # Windows box (2026-11-08; packaging/make-windows-release.ps1 remains the
  # by-hand route and this job mirrors its stage). MSVC + Qt 6.8 from the
  # official installer (aqt), rnnoise 0.2 built as a static lib from the
  # xiph release (its vcpkg port is !windows), voacapl via MSYS2 gfortran
  # (docs/windows-build.md), SDRplay from the API HEADER alone: the Windows
  # installer is not fetchable headlessly (403, never archived), so the
  # header rides in from the Linux .run the AppImage job already uses and
  # the import library is generated from the API's exported names with
  # lib.exe — the exe delay-loads sdrplay_api.dll (CMakeLists), so nothing
  # proprietary is linked in or shipped. Not yet built on Windows at all:
  # WDSP receive audio, RADE, Copy Assist (CMake disables them there), so
  # this zip is the Windows port as it stands, not a lesser Linux build.
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6.8 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtserialport qtwebsockets qtshadertools qtmultimedia'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build rnnoise 0.2 (static, MSVC)
        run: |
          curl.exe -fsSL -o rnnoise.tgz https://github.com/xiph/rnnoise/releases/download/v0.2/rnnoise-0.2.tar.gz
          tar xzf rnnoise.tgz
          # The ~25-line CMakeLists the station uses (docs/windows-build.md
          # §5): the RNNOISE_SOURCES of Makefile.am, __SSE2__ defined by
          # hand — MSVC never predefines it and vec.h then wants a header
          # the release does not ship.
          @"
          cmake_minimum_required(VERSION 3.20)
          project(rnnoise C)
          add_library(rnnoise STATIC
            src/denoise.c src/rnn.c src/pitch.c src/kiss_fft.c src/celt_lpc.c
            src/nnet.c src/nnet_default.c src/parse_lpcnet_weights.c
            src/rnnoise_data.c src/rnnoise_tables.c)
          target_include_directories(rnnoise PUBLIC include PRIVATE src)
          target_compile_definitions(rnnoise PRIVATE __SSE2__ RNNOISE_BUILD)
          install(TARGETS rnnoise ARCHIVE DESTINATION lib)
          install(FILES include/rnnoise.h DESTINATION include)
          "@ | Set-Content rnnoise-0.2/CMakeLists.txt
          cmake -S rnnoise-0.2 -B rnnoise-build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/rnnoise-install"
          cmake --build rnnoise-build
          cmake --install rnnoise-build
          Get-ChildItem -Recurse rnnoise-install

      - name: SDRplay API header + generated import library (build-time only)
        run: |
          $ver = "3.15.2"
          # Same bytes the AppImage job uses (vendor first, Internet Archive
          # fallback). A makeself .run is a shell header + tar.gz payload:
          # Git Bash's sh and tar unpack it; only the headers are wanted.
          $ok = $false
          foreach ($u in @("https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-$ver.run",
                           "https://web.archive.org/web/20260805142854id_/https://www.sdrplay.com/software/SDRplay_RSP_API-Linux-$ver.run")) {
            try { curl.exe -fSL $u -o sdr.run; if ($LASTEXITCODE -eq 0) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { throw "SDRplay API archive not downloadable" }
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          & "C:\Program Files\Git\bin\bash.exe" -c "cd '$ws' && (sh sdr.run --noexec --target sdr_api || sh sdr.run --tar xf)"
          New-Item -ItemType Directory -Force sdrplay/inc, sdrplay/x64 | Out-Null
          Get-ChildItem -Recurse sdr_api -Filter *.h | Copy-Item -Destination sdrplay/inc
          if (-not (Test-Path sdrplay/inc/sdrplay_api.h)) { throw "sdrplay_api.h not in the archive" }
          # Every function the API exports (sdrplay_api.h), undecorated C
          # names — the x64 DLL exports exactly these. lib.exe turns the list
          # into the import library the linker wants; the DLL itself is the
          # operator's own installed API at run time.
          $names = Select-String -Path sdrplay/inc/*.h -Pattern 'sdrplay_api_[A-Za-z0-9_]+\s*\(' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { ($_.Value -replace '\s*\($','') } | Sort-Object -Unique
          if ($names.Count -lt 10) { throw "only $($names.Count) API names found in the header" }
          @("LIBRARY sdrplay_api", "EXPORTS") + $names | Set-Content sdrplay/x64/sdrplay_api.def
          Get-Content sdrplay/x64/sdrplay_api.def
          lib.exe /nologo /def:sdrplay/x64/sdrplay_api.def /machine:x64 /out:sdrplay/x64/sdrplay_api.lib
          if ($LASTEXITCODE -ne 0) { throw "lib.exe failed" }

      - name: Set up MSYS2 (gfortran for voacapl)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-gcc
            autoconf automake libtool make git

      - name: Build voacapl (bundled propagation engine)
        shell: msys2 {0}
        run: |
          set -e
          git clone --depth 1 https://github.com/jawatson/voacapl /tmp/voacapl
          cd /tmp/voacapl && autoreconf -i
          ./configure --prefix=/tmp/voa LDFLAGS="-static"
          make -j"$(nproc)"
          # docs/windows-build.md: upstream's install hooks write
          # $(DESTDIR)/$(bindir) = "//tmp/voa/bin", a UNC host to MSYS.
          sed -i 's|$(DESTDIR)/$(bindir)|$(DESTDIR)$(bindir)|g; s|$(DESTDIR)/$(datadir)|$(DESTDIR)$(datadir)|g' Makefile
          make install
          HOME=/tmp/voahome /tmp/voa/bin/makeitshfbc
          DEST="$(cygpath -u "$GITHUB_WORKSPACE")/voacapl-win"
          mkdir -p "$DEST"
          cp /tmp/voa/bin/voacapl.exe "$DEST/"
          cp -rL /tmp/voahome/itshfbc "$DEST/itshfbc"      # -L: never ship symlinks
          N=$(ls "$DEST/itshfbc/coeffs" | wc -l)
          echo "itshfbc coefficient files: $N"
          test "$N" -ge 40 || { echo "expected 45 coefficient files"; exit 1; }
          # Statically linked: no MinGW DLL may be needed beside it.
          ldd "$DEST/voacapl.exe" || true

      - name: Configure + build (RelWithDebInfo, SDRplay on)
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR;$env:GITHUB_WORKSPACE/rnnoise-install" `
            -DSDRPLAY_ROOT="$env:GITHUB_WORKSPACE/sdrplay" `
            -DBUILD_SDRPLAY=ON 2>&1 | Tee-Object configure.log
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          # The operator's rule: the published build is the console as it
          # stands — fail loudly rather than ship a lesser one.
          if (-not (Select-String -Quiet -Path configure.log -Pattern "SDRplay RSP source: ENABLED")) { throw "SDRplay source not enabled" }
          if (-not (Select-String -Quiet -Path configure.log -Pattern "GPU panadapter: on")) { throw "GPU panadapter off" }
          cmake --build build-win
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Stage zip (windeployqt, VOACAP, README; never sdrplay_api)
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "tentec-console-$tag-win64"
          $stage = Join-Path (Get-Location) $name
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item build-win/tentec-console.exe $stage
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime (Join-Path $stage "tentec-console.exe")
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          Copy-Item voacapl-win/voacapl.exe $stage
          Copy-Item voacapl-win/itshfbc (Join-Path $stage "itshfbc") -Recurse
          $coeffs = (Get-ChildItem (Join-Path $stage "itshfbc/coeffs") -File).Count
          if ($coeffs -lt 40) { throw "itshfbc/coeffs has only $coeffs files - expected 45" }
          $contraband = Get-ChildItem -Recurse $stage -Filter "sdrplay_api*"
          if ($contraband) { throw "sdrplay_api files in the stage - never bundle them: $($contraband.Name)" }
          @"
          Orion Control $tag - Windows x64
          ================================

          GPL-3 open source: https://github.com/n8mus/Orion-Control
          (this zip is the corresponding binary; source for this exact build is
          the $tag tag)

          SDRplay panadapter: this build uses the SDRplay API but does NOT bundle
          it (not redistributable). Install the SDRplay API/HW driver from
          https://www.sdrplay.com/api/ - the console finds the installed API by
          itself. Without it the console runs radio-only (no panadapter).

          VOACAP propagation overlay: voacapl.exe and the itshfbc data tree ARE
          bundled (public-domain NTIA/ITS core, so redistribution is fine). Keep
          them beside tentec-console.exe - unpack the whole zip, not just the exe.
          The console copies the data tree into your AppData on first use, because
          voacapl writes its working files into it. Turn the overlay on in
          Setup > Display; it draws on the world-map backdrops.

          Not in the Windows build yet: WDSP receive audio, FreeDV RADE and
          Copy Assist (Linux only so far).

          Run tentec-console.exe. Settings live per-user in the registry
          (HKCU\Software\n8mus\tentec-console).
          "@ | Set-Content (Join-Path $stage "README-WINDOWS.txt")
          Compress-Archive -Path $stage -DestinationPath "$name.zip"
          Get-Item "$name.zip" | Format-List Name, Length

      - name: Smoke test (starts and exits under the self-test harness)
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "tentec-console-$tag-win64/tentec-console.exe"
          # No SDR, a COM port that does not exist (the radio just stays
          # down), the runner's own desktop as the display.
          $env:TTC_SELFTEST = "4"; $env:TTC_NOSDR = "1"; $env:TTC_RADIO = "orion"
          $env:TTC_RADIO_DEV = "COM99"; $env:TTC_RIGCTLD_PORT = "14599"
          $env:TTC_SCREENSHOT = (Join-Path (Get-Location) "windows-smoke.png")
          # The zip must stand on its own: hide the runner's Qt from it.
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru -Wait -RedirectStandardError smoke.err -RedirectStandardOutput smoke.out
          Get-Content smoke.err, smoke.out -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { throw "self-test exit $($p.ExitCode)" }
          if (-not (Test-Path windows-smoke.png)) { throw "no screenshot: the window never came up" }
          Get-Item windows-smoke.png | Format-List Name, Length

      - name: Keep the smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-screenshot
          path: windows-smoke.png

      - name: Keep the zip as a run artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: tentec-console-win64
          path: tentec-console-*-win64.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          make_latest: true
          files: tentec-console-*-win64.zip
